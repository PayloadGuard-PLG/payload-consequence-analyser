name: Trigger Regression

# Manual-only dispatch to the test harness regression runner.
# Removed push-to-main auto-trigger: each push fired ~200 GitHub events
# (34 PRs opened/scanned/closed) flooding connected Claude Code sessions.
# Regression runs on explicit workflow_dispatch or the harness daily schedule.
#
# Requires REGRESSION_PAT secret in this repo — a GitHub PAT with repo scope
# on payloadguard-test-harness. If the secret is absent the step warns and
# exits 0 (non-blocking).

on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dispatch analyser-updated to test harness
        env:
          REGRESSION_PAT: ${{ secrets.REGRESSION_PAT }}
          PG_SHA: ${{ github.sha }}
          PG_REF: ${{ github.ref }}
          PG_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$REGRESSION_PAT" ]; then
            echo "::warning::REGRESSION_PAT secret is not configured — skipping regression dispatch."
            echo "::warning::Add a GitHub PAT with repo scope on payloadguard-test-harness as REGRESSION_PAT."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: token $REGRESSION_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/PayloadGuard-PLG/payloadguard-test-harness/dispatches \
            -d "$(jq -nc \
                  --arg sha "$PG_SHA" --arg ref "$PG_REF" --arg actor "$PG_ACTOR" \
                  '{event_type:"analyser-updated",client_payload:{sha:$sha,ref:$ref,actor:$actor}}')"
          echo "Dispatched analyser-updated to payloadguard-test-harness (sha: $PG_SHA)"